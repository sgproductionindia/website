<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.sgproduction\.music$ [NC]
    RewriteRule ^ https://sgproduction.music%{REQUEST_URI} [R=301,L]
    RewriteRule ^/(?:sitemap\.xml|robots\.txt)$ - [L]
    RewriteRule ^/index\.html$ / [R=301,L]
    RewriteRule ^/artists\.html$ /artists [R=301,L]
    RewriteRule ^/(.+)/$ /$1 [R=301,L]
    RewriteRule ^/api/ad-click$ /api/ad-click.php [L]
    RewriteRule ^/api/ad-impression$ /api/ad-impression.php [L]
    RewriteRule ^/api/download$ /api/download.php [L]
    RewriteRule ^/song/(.+)$ /index.php [L,QSA]
    RewriteRule ^/tracks$ /index.php [L,QSA]
    RewriteRule ^/licensing$ /index.php [L,QSA]
    RewriteRule ^/about$ /about.php [L,QSA]
    RewriteRule ^/contact$ /contact.php [L,QSA]
    RewriteRule ^/usage-policy$ /usage-policy.php [L,QSA]
    RewriteRule ^/artists$ /artists.html [L]
    RewriteRule ^/artist/(.+)$ /artists.html [L,QSA]
    RewriteRule ^/admin$ /admin.php [L]

    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType text/javascript "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
    </IfModule>

    <FilesMatch "\.(?:css|js|mjs|jpg|jpeg|png|webp|svg|ico|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    <FilesMatch "\.(?:html|php|json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    <FilesMatch "^(?:sitemap\.xml|robots\.txt)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    AddType application/xml .xml
    AddType text/plain .txt

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^song/(.+)$ index.php [L,QSA]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^tracks$ index.php [L,QSA]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^licensing$ index.php [L,QSA]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^about$ about.php [L,QSA]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^contact$ contact.php [L,QSA]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^usage-policy$ usage-policy.php [L,QSA]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^artists$ artists.html [L,QSA]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^artist/(.+)$ artists.html [L,QSA]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
